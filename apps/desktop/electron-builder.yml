appId: com.diskort.app
productName: Diskort
copyright: Copyright © 2026 Diskort

directories:
  output: release/${version}
  buildResources: build

# ─── Kimlik: bu değerler kurulu uygulamaların güncellenebilmesi için DEĞİŞTİRİLMEMELİ ───
# appId: Windows bildirim kimliği (AppUserModelId) ve macOS paket kimliği
# name: kurulum klasörü (Programs\diskort) ve güncelleme önbelleği (diskort-updater)
# productName: görünen ad, exe adı ve ayar klasörü (%APPDATA%\Diskort)
# nsis.guid: kayıt defteri anahtarları; aynı kaldıkça yeni sürüm eskisinin üstüne kurulur
extraMetadata:
  name: diskort

files:
  - out/**
  - resources/**
  - package.json

# Davet bağlantıları (diskort://davet/<kod>, indirme sayfasındaki "Uygulamada aç") uygulamayı açar.
# macOS: CFBundleURLTypes; Linux: .desktop dosyasında x-scheme-handler/diskort. Windows'ta NSIS bunu
# yazmaz: build/installer.nsh kaydeder, uygulama da açılışta setAsDefaultProtocolClient ile yeniler.
protocols:
  - name: Diskort
    schemes: [diskort]

# Chromium'un yalnızca Türkçe ve İngilizce dil dosyaları (~45 MB daha küçük kurulum ve güncelleme)
electronLanguages: [tr, en-US]

# uiohook-napi N-API ön-derlemeli ikili dosyalarla gelir (ABI bağımsız); derleyici gerekmez.
npmRebuild: false

# Yerel (native) modül .node dosyaları asar dışında olmalı
asarUnpack:
  - node_modules/uiohook-napi/**

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: Diskort-Setup-${version}.${ext}
  # Kod imzası CI'da SignPath ile yapılır (docs/kod-imzalama.md). Güncelleyicinin indirilen kurulumun
  # yayıncı adını denetlemesi bilerek kapalı: app-update.yml'e publisherName yazılırsa, imzasız bir
  # sürüm (SignPath yokken yedek yol) ya da sertifika adı değişikliği kurulu uygulamaların
  # güncellenmesini kalıcı olarak kırar. Bütünlük latest.yml'deki sha512 ve HTTPS ile sağlanır.
  verifyUpdateCodeSignature: false

# Tek tıkla, yönetici izni istemeden kullanıcıya özel kurulum (Discord gibi). Ayrıntılar: build/installer.nsh
nsis:
  oneClick: true
  perMachine: false
  guid: 921913cc-d4e1-5f2f-9679-952e9a2927d6
  deleteAppDataOnUninstall: false
  shortcutName: Diskort
  runAfterFinish: true
  include: build/installer.nsh

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  icon: resources/icon.png
  executableName: diskort
  synopsis: Arkadaşlarınla sesli sohbet ve ekran paylaşımı
  maintainer: Diskort <diskort@ziroo.net>
  artifactName: Diskort-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.social-networking
  icon: resources/icon.png
  artifactName: Diskort-${version}-${arch}.${ext}
  # Apple Developer ID olmadan: ad-hoc imza (Apple Silicon'da çalışabilmek için şart).
  # Kullanıcı ilk açılışta Sistem Ayarları → Gizlilik ve Güvenlik → "Yine de Aç" der.
  # Developer ID + notarizasyon eklenince: identity kaldırılır, hardenedRuntime: true,
  # entitlements: build/entitlements.mac.plist ve hedeflere zip eklenir (otomatik güncelleme için).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Diskort sesli sohbet için mikrofonunu kullanır.
    NSCameraUsageDescription: Diskort ileride görüntülü sohbet için kamerayı kullanabilir.

# Sürüm dosyaları GitHub Releases'e yüklenir. Uygulamalar güncellemeyi GitHub'dan değil
# https://diskort.ziroo.net/updates adresinden ister (src/shared/distribution.ts); sunucu dosyalara
# yönlendirir. Böylece dağıtım yeri değişse bile kurulu uygulamalar etkilenmez.
publish:
  provider: github
  owner: zziroo
  repo: diskort
