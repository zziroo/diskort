# Diskort sunucu yığını (VPS): LiveKit (ses/görüntü SFU) + API + Caddy (otomatik HTTPS, `caddy` profili)
# Kullanım (infra klasöründe):
#   cp .env.example .env   # alan adlarını ve gizli anahtarları doldur
#   docker compose up -d --build
#
# Tüm servisler host ağında çalışır: UDP medya portları NAT'sız ve en düşük gecikmeyle açılır.
# API (3000) ve LiveKit HTTP (7880) yalnızca yerelde dinler; dışarıya Caddy (80/443) açılır.

# Konteyner günlükleri diski doldurmasın: servis başına en fazla 5 × 20 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    logging: *logging
    # livekit.yaml içindeki __TURN_DOMAIN__ yer tutucusunu doldurup sunucuyu başlatır
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sed "s/__TURN_DOMAIN__/$$TURN_DOMAIN/" /etc/livekit.yaml > /tmp/livekit.yaml && exec /livekit-server --config /tmp/livekit.yaml
    network_mode: host
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # API anahtarı adı sabit "diskort"; gizli anahtar .env'den gelir
      LIVEKIT_KEYS: "diskort: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET gerekli}"
      TURN_DOMAIN: ${TURN_DOMAIN:?TURN_DOMAIN gerekli}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    logging: *logging
    network_mode: host
    restart: unless-stopped
    depends_on: [livekit]
    # Görüntü node (1000) olarak çalışır; API_USER boşsa root'ta kalır, çünkü eski kurulumlarda /data, secrets ve
    # yedek klasörü root'a aittir. Sahiplik göçü: docs/sunucu-kurulumu.md, "Root'suz çalıştırma"
    user: ${API_USER:-0:0}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli}
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN:?LIVEKIT_DOMAIN gerekli}
      LIVEKIT_API_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: diskort
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      GUILD_NAME: ${GUILD_NAME:-Diskort}
      CLIENT_UPDATE_ENFORCE: ${CLIENT_UPDATE_ENFORCE:-1}
      MIN_ANDROID_VERSION: ${MIN_ANDROID_VERSION:-}
      MIN_IOS_VERSION: ${MIN_IOS_VERSION:-}
      # Telefon bildirimleri: Firebase hizmet hesabı anahtarı (infra/secrets/fcm.json, depoda değil)
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      # iOS bildirimleri: Apple APNs anahtarı (infra/secrets/apns.p8, depoda değil); bkz. docs/ios.md
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-com.diskort.app}
      # iPhone cihaz onayında Ad Hoc IPA'yı otomatik derletmek için GitHub belirteci (Actions: write); bkz. docs/ios.md
      GITHUB_DISPATCH_TOKEN: ${GITHUB_DISPATCH_TOKEN:-}
      # İş akışına giden cihaz listesinin şifre anahtarı (GitHub'daki IOS_DEVICES_KEY ile aynı); yoksa derleme başlatılmaz
      IOS_DEVICES_KEY: ${IOS_DEVICES_KEY:-}
      IOS_DISPATCH_DELAY_SEC: ${IOS_DISPATCH_DELAY_SEC:-180}
      # Tek dosya ekinin en büyük boyutu (MB); dosyalar diskort-data biriminde /data/attachments altında
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-25}
      # GIF araması (GIPHY); anahtar yoksa kapalı
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GIPHY_RATING: ${GIPHY_RATING:-pg-13}
      GIPHY_LANG: ${GIPHY_LANG:-tr}
      # Yönetim paneli: sertifika bitiş tarihleri denetlenen alan adları (127.0.0.1:443'e TLS el sıkışması,
      # 6 saatte bir) ve salt okunur bağlanan veritabanı yedekleri (son yedeğin zamanı ve boyutu).
      # LiveKit (127.0.0.1:6789) ve Caddy (127.0.0.1:2020, Caddyfile'daki yerel metrics sitesi) ölçüm adresleri
      # üretimde varsayılandır; LIVEKIT_METRICS_URL=0 / CADDY_METRICS_URL=0 kapatır.
      CADDY_METRICS_URL: ${CADDY_METRICS_URL:-http://127.0.0.1:2020/metrics}
      TLS_CHECK_DOMAINS: ${DISKORT_DOMAIN},${LIVEKIT_DOMAIN},${TURN_DOMAIN}
      BACKUP_DIR: /backups
      # Hat testi UDP ucu (LiveKit medya aralığında, ufw'de zaten açık: 50000-60000/udp). Boşsa 59999'dan başlar,
      # doluysa bir altını dener; "off" kapatır. Toplam bant sınırı Mbps (tools/udp-probe/README.md): olağan
      # (varsayılan 24) ve yönetici oturumları / patlama testi için (varsayılan 48)
      LINE_TEST_PORT: ${LINE_TEST_PORT:-}
      LINE_TEST_MAX_MBPS: ${LINE_TEST_MAX_MBPS:-}
      LINE_TEST_ADMIN_MAX_MBPS: ${LINE_TEST_ADMIN_MAX_MBPS:-}
    volumes:
      - diskort-data:/data
      - ./secrets:/run/secrets:ro
      # infra/backup-db.sh ve backup-attachments.sh'in yazdığı yer (yalnızca okunur)
      - /var/backups/diskort:/backups:ro

  caddy:
    # Katman-4 eklentili Caddy (TURN/TLS'i 443'te HTTPS ile paylaşmak için). Yalnızca `caddy` profiliyle
    # başlar (setup-vps.sh'in yazdığı .env'de COMPOSE_PROFILES=caddy). Üretim sunucusunda 443'ü aynı
    # sunucudaki diğer projelerle paylaşan ayrı ziroo-edge projesi tutar; orada bu servis kapalıdır ve
    # Diskort siteleri caddy/diskort.caddy'den içe aktarılır.
    profiles: ["caddy"]
    build: ./caddy
    image: diskort-caddy
    logging: *logging
    network_mode: host
    restart: unless-stopped
    environment:
      DISKORT_DOMAIN: ${DISKORT_DOMAIN:?DISKORT_DOMAIN gerekli}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      TURN_DOMAIN: ${TURN_DOMAIN:?TURN_DOMAIN gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/diskort:ro
      - ../apps/web:/srv/web:ro
      - /opt/ziroo-sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  diskort-data:
  caddy-data:
  caddy-config:
