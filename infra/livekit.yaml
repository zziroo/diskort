# Üretim LiveKit yapılandırması (VPS). Anahtarlar LIVEKIT_KEYS ortam değişkeninden gelir.
port: 7880
# HTTP ve Prometheus portları yalnız yerelde dinler. rtc.tcp_port, TURN UDP ve TURN tls_port bu ayara uymaz.
bind_addresses:
  - 127.0.0.1

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Sunucunun genel IP'sini STUN ile otomatik bulur
  use_external_ip: true

# Yedek röle (TURN): doğrudan UDP bağlantı kurulamayan ağlar için.
# - TURN/UDP 3478
# - TURN/TLS: TLS 443'te Caddy tarafından açılıp (bkz. Caddyfile) PROXY protokolüyle 5349'a iletilir.
#   LiveKit external_tls modunda istemcilere turns:<alan adı>:443 bildirir (1.13'te ölçüldü); masaüstü
#   uygulaması olası 5349 bildirimine karşı da 443'e düzeltir (turnPort.ts).
#   5349 dışarıya kapalıdır (güvenlik duvarı + yalnızca yerel PROXY başlığına güvenilir).
# __TURN_DOMAIN__ başlangıçta TURN_DOMAIN ortam değişkeniyle değiştirilir (docker-compose.yml).
turn:
  enabled: true
  udp_port: 3478
  domain: __TURN_DOMAIN__
  tls_port: 5349
  external_tls: true
  proxy_protocol: true

room:
  auto_create: true
  empty_timeout: 30
  departure_timeout: 10
  max_participants: 25

# Konuşan göstergesinin Discord gibi hızlı tepki vermesi için
audio:
  active_level: 35
  min_percentile: 40
  update_interval: 100
  smooth_intervals: 1

webhook:
  api_key: diskort
  urls:
    - http://127.0.0.1:3000/api/livekit/webhook

# Yönetim paneli ölçümleri (Prometheus): bayt/paket, kayıp, NACK/PLI, oda/katılımcı/iz sayıları, LiveKit
# sürecinin CPU/belleği. API 127.0.0.1:6789/metrics'ten 10 sn'de bir okur (LIVEKIT_METRICS_URL).
# Bu port (7880 gibi) bind_addresses gereği yalnız 127.0.0.1'de açılır. Bütün arayüzlerde açılan 7881, 3478 ve
# 5349 için dışarıdan erişimi güvenlik duvarı belirler (ufw yalnızca 22, 80, 443, 7881/tcp, 3478/udp,
# 50000-60000/udp'ye izin verir). Bu ayar LiveKit yeniden başlatılınca etkinleşir (görüşmeler birkaç saniye
# kopar); o zamana kadar panel "metrikler kapalı" gösterir.
prometheus:
  port: 6789

logging:
  level: info
