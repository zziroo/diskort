# Sürüm derleme: "v*" etiketi gönderilince Windows, Linux, macOS, Android (ve anahtarlar varsa iOS) paketlerini derleyip
# GitHub'daki taslak (draft) sürüme yükler. Taslak GitHub'da yayınlanınca indirme sayfası
# ve uygulama içi güncellemeler yeni sürümü görür.
#
# Kullanım: apps/desktop ve apps/mobile package.json'daki "version"u artır (aynı olmalı), commit'le, sonra
#   git tag v0.1.1 && git push origin v0.1.1
#
# Windows kod imzası (SignPath Foundation): SIGNPATH_API_TOKEN ve SIGNPATH_ORGANIZATION_ID gizli
# değerleri ile SIGNPATH_PROJECT_SLUG değişkeni tanımlıysa Windows işi Diskort.exe'yi ve kurulum
# dosyasını SignPath'e imzalatır; tanımlı değilse eskisi gibi imzasız yayınlar. Ayrıntılar: docs/kod-imzalama.md
#
# macOS imzası (Apple Developer ID + notarizasyon): MAC_CERT_P12_BASE64 ve MAC_CERT_PASSWORD gizli değerleri varsa
# macOS işi uygulamayı imzalar, ASC_KEY_P8/ASC_KEY_ID/ASC_ISSUER_ID ile Apple'a notarize ettirir; sertifika yoksa
# eskisi gibi ad-hoc imzayla yayınlar (otomatik güncelleme o sürümde çalışmaz). Ayrıntılar: docs/kod-imzalama.md
name: Sürüm derle

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Taslak sürüm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Etiket ile uygulama sürümleri aynı mı?
        run: |
          for app in desktop mobile; do
            version=$(node -p "require('./apps/$app/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Etiket ($GITHUB_REF_NAME) ile apps/$app/package.json sürümü (v$version) uyuşmuyor"
              exit 1
            fi
          done

      # Paralel derlemeler aynı sürümü ayrı ayrı oluşturmaya çalışmasın diye taslak önceden açılır.
      - name: Taslak oluştur (yoksa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "${GITHUB_REF_NAME#v}" --notes "Diskort ${GITHUB_REF_NAME#v}"
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Masaüstü paketi telefon uygulamasını gerektirmez: Skia'nın yerel kütüphaneleri (~1,4 GB) indirilmesin
      - run: pnpm install --frozen-lockfile --filter "!@diskort/mobile"

      - name: Derle
        run: pnpm --filter @diskort/desktop exec electron-vite build

      - name: Paketle ve taslağa yükle
        run: pnpm --filter @diskort/desktop exec electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Paketlenmiş uygulama açılıyor mu? (sanal ekranda 20 sn çalışmalı, çökmemeli)
      - name: Açılış testi (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          set +e
          timeout 20 xvfb-run -a apps/desktop/release/*/linux-unpacked/diskort --no-sandbox --disable-gpu
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::Uygulama 20 saniye dolmadan kapandı (çıkış kodu $code)"
            exit 1
          fi
          echo "Uygulama 20 saniye boyunca sorunsuz çalıştı."

  # macOS ayrı iş: Developer ID ile imzalı + notarize edilmiş paket (sertifika yoksa iş hata verir).
  # Otomatik güncelleme (Squirrel.Mac) yalnızca imzalı sürümlerde çalışır ve yeni sürümün AYNI takımca imzalanmasını
  # ister: imzalı sürümler çıkmaya başladıktan sonra ad-hoc yedek yolla yayınlanan bir sürüm, kurulu uygulamalara
  # otomatik kurulamaz (kullanıcı indirme sayfasından elle kurar). Sertifika gizli değerini silme/boş bırakma.
  macos:
    name: macOS
    needs: draft
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      MAC_SIGNING: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Telefon uygulaması hariç (bkz. build işi)
      - run: pnpm install --frozen-lockfile --filter "!@diskort/mobile"

      - name: Derle
        run: pnpm --filter @diskort/desktop exec electron-vite build

      # İmzalı sürümler çıktıktan sonra ad-hoc yayın kurulu uygulamaları elle kuruluma zorlar: sertifika yoksa dur.
      # (Yerel/ad-hoc paket: electron-builder --mac -c.mac.identity=- -c.mac.hardenedRuntime=false)
      - name: Sertifika yok, dur
        if: env.MAC_SIGNING != 'true'
        run: |
          echo "::error::MAC_CERT_P12_BASE64 tanımlı değil; imzasız macOS paketi imzalı kurulumlara otomatik kurulamaz"
          exit 1

      # CSC_LINK: geçici .p12 dosyası (electron-builder geçici bir anahtar zinciri açıp içe aktarır, sonunda siler).
      # APPLE_API_KEY: .p8 dosyasının yolu; APPLE_API_KEY_ID + APPLE_API_ISSUER ile birlikte notarizasyonu açar.
      - name: Paketle, imzala, notarize et ve taslağa yükle
        if: env.MAC_SIGNING == 'true'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          p12="$RUNNER_TEMP/diskort-mac.p12"
          p8="$RUNNER_TEMP/diskort-asc.p8"
          trap 'rm -f "$p12" "$p8"' EXIT
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$p12"
          unset MAC_CERT_P12_BASE64
          export CSC_LINK="$p12"
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$p8"
            export APPLE_API_KEY="$p8" APPLE_API_KEY_ID="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID"
          else
            echo "::warning::ASC_KEY_P8/ASC_KEY_ID/ASC_ISSUER_ID eksik; macOS paketi imzalı ama notarizasyonsuz (ilk açılışta Gatekeeper uyarısı)"
          fi
          unset ASC_KEY_P8
          # İmza bulunamazsa imzasız paket çıkmasın, iş hata versin
          pnpm exec electron-builder --mac --publish always -c.forceCodeSigning=true

      - name: İmzayı ve notarizasyonu denetle
        if: env.MAC_SIGNING == 'true'
        working-directory: apps/desktop
        env:
          NOTARIZED: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          grep -q "Diskort-$v-arm64.zip" "release/$v/latest-mac.yml"
          grep -q "Diskort-$v-x64.zip" "release/$v/latest-mac.yml"
          for app in "release/$v/mac-arm64/Diskort.app" "release/$v/mac/Diskort.app"; do
            codesign --verify --deep --strict "$app"
            info=$(codesign --display --verbose=2 "$app" 2>&1)
            team=$(printf '%s\n' "$info" | sed -n 's/^TeamIdentifier=//p')
            if [ -z "$team" ] || [ "$team" = "not set" ]; then echo "::error::$app Developer ID ile imzalı değil"; exit 1; fi
            if [ -n "$TEAM" ] && [ "$team" != "$TEAM" ]; then echo "::error::$app takımı ($team) APPLE_TEAM_ID ile uyuşmuyor"; exit 1; fi
            printf '%s\n' "$info" | grep -q 'flags=.*runtime' || { echo "::error::$app sertleştirilmiş çalışma ortamı kapalı"; exit 1; }
            if [ "$NOTARIZED" = "true" ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose "$app"
            fi
            echo "$app: imzalı (takım $team)"
          done

  # Windows ayrı iş: SignPath ayarlıysa imzalı, değilse (eskisi gibi) imzasız paket.
  #
  # İmzalı yol neden birkaç adım: electron-builder latest.yml'e kurulum dosyasının sha512'sini yazar ve
  # fark güncellemesi için .blockmap üretir. Dosya bundan SONRA imzalanırsa baytları değişir ve kurulu
  # uygulamalar güncellemeyi "sha512 checksum mismatch" ile reddeder. Bu yüzden:
  #   1. uygulama paketlenir, yalnızca Diskort.exe SignPath'e imzalatılır (1. onay),
  #   2. kurulum dosyası imzalı uygulama klasöründen (--prepackaged) derlenir,
  #   3. kurulum dosyası SignPath'e imzalatılır (2. onay),
  #   4. latest.yml ve .blockmap imzalı dosyadan yeniden üretilir (scripts/win-update-info.mjs),
  #   5. üç dosya taslak sürüme yüklenir.
  windows:
    name: Windows
    needs: draft
    runs-on: windows-latest
    permissions:
      contents: write
      # SignPath bağlayıcısı GitHub belirteciyle iş ayrıntılarını okur ve yüklenen dosyayı indirir
      actions: read
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Telefon uygulaması hariç (bkz. üstteki iş)
      - run: pnpm install --frozen-lockfile --filter "!@diskort/mobile"

      - name: Derle
        run: pnpm --filter @diskort/desktop exec electron-vite build

      - name: Paketle ve taslağa yükle (imzasız)
        if: env.SIGNPATH_ENABLED != 'true'
        run: |
          echo "::notice::SignPath ayarlı değil; Windows paketi imzasız yayınlanıyor (docs/kod-imzalama.md)"
          pnpm --filter @diskort/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # ─── İmzalı yol ───

      - name: Sürümü oku
        id: ver
        if: env.SIGNPATH_ENABLED == 'true'
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      # --dir yerine tam derleme: app-update.yml (güncelleyici ayarı) yalnızca nsis hedefiyle yazılır.
      # Bu aşamanın imzasız kurulum dosyası atılır.
      - name: Uygulamayı paketle
        if: env.SIGNPATH_ENABLED == 'true'
        working-directory: apps/desktop
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          pnpm exec electron-builder --win --publish never
          test -f "release/$V/win-unpacked/resources/app-update.yml"
          rm -rf release/win-unpacked-signed
          mv "release/$V/win-unpacked" release/win-unpacked-signed
          rm -rf "release/$V"

      - name: Diskort.exe'yi SignPath'e yükle
        id: upload-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diskort-app-unsigned
          path: apps/desktop/release/win-unpacked-signed/Diskort.exe
          if-no-files-found: error
          retention-days: 1

      - name: Diskort.exe'yi imzala (SignPath onayı bekler)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION_SLUG || 'app' }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/signed-app

      - name: İmzalı Diskort.exe'yi yerleştir
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        working-directory: apps/desktop/release
        run: |
          Copy-Item signed-app/Diskort.exe win-unpacked-signed/Diskort.exe -Force
          $sig = Get-AuthenticodeSignature win-unpacked-signed/Diskort.exe
          if ($sig.Status -ne 'Valid') { Write-Output "::error::Diskort.exe imzası geçersiz: $($sig.Status)"; exit 1 }
          Write-Output "Diskort.exe imzalı: $($sig.SignerCertificate.Subject)"

      # Hazır (imzalı) uygulama klasöründen yalnızca kurulum dosyası, latest.yml ve blockmap üretilir;
      # electron-builder bu modda Diskort.exe'ye dokunmaz, app-update.yml 1. aşamadan gelir.
      - name: Kurulum dosyasını derle
        if: env.SIGNPATH_ENABLED == 'true'
        working-directory: apps/desktop
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          pnpm exec electron-builder --win --prepackaged release/win-unpacked-signed --publish never
          test -f "release/$V/Diskort-Setup-$V.exe"
          test -f "release/$V/latest.yml"

      - name: Kurulum dosyasını SignPath'e yükle
        id: upload-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: diskort-installer-unsigned
          path: apps/desktop/release/${{ steps.ver.outputs.version }}/Diskort-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Kurulum dosyasını imzala (SignPath onayı bekler)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/release/signed-installer

      - name: İmzalı kurulum dosyasını yerleştir
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        working-directory: apps/desktop/release
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          $name = "Diskort-Setup-$env:V.exe"
          Copy-Item "signed-installer/$name" "$env:V/$name" -Force
          $sig = Get-AuthenticodeSignature "$env:V/$name"
          if ($sig.Status -ne 'Valid') { Write-Output "::error::$name imzası geçersiz: $($sig.Status)"; exit 1 }
          Write-Output "$name imzalı: $($sig.SignerCertificate.Subject)"

      # İmza dosyanın baytlarını değiştirdi: sha512/boyut (latest.yml) ve blockmap yeniden hesaplanır.
      - name: Güncelleme bilgisini yeniden üret
        if: env.SIGNPATH_ENABLED == 'true'
        run: node scripts/win-update-info.mjs "apps/desktop/release/${{ steps.ver.outputs.version }}"

      - name: Taslağa yükle
        if: env.SIGNPATH_ENABLED == 'true'
        working-directory: apps/desktop/release/${{ steps.ver.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          gh release upload "v$V" -R "$GITHUB_REPOSITORY" --clobber \
            "Diskort-Setup-$V.exe" "Diskort-Setup-$V.exe.blockmap" latest.yml

  android:
    name: Android
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      release-tag: ${{ github.ref_name }}
    secrets: inherit

  # iOS: yalnızca imza anahtarları varsa IPA + iOS OTA paketi (yoksa atlanır; bkz. docs/ios.md)
  ios:
    name: iOS
    needs: draft
    uses: ./.github/workflows/ios.yml
    with:
      release-tag: ${{ github.ref_name }}
    secrets: inherit
