# main'e her push'ta ve her pull request'te tip kontrolü ve tüm paketlerin testleri
name: Kontrol

on:
  push:
    branches: [main]
  pull_request:
  # Sürüm derlemesi aynı denetimden geçmeden başlamaz (release.yml)
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Testler
        run: pnpm test
